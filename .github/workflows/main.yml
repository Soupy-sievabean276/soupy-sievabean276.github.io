name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A6C1B8: ${{ secrets.A6C1B8 }}
          BCF6CF: ${{ secrets.BCF6CF }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A6C1B8', '')
          k2 = os.environ.get('BCF6CF', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 444730aa36e65c39156a1e -->', k1) if k1 else txt
          out = out.replace('<!-- adfb6459083a9e0107cc -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
